<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect - Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="messages.css">
</head>
<body>
  <div class="chat-title">💬 chat /message</div>
  <div class="chat">
    <!-- LEFT: list of people -->
    <aside class="chat-list">
      <div class="person"><span class="pic">👤</span><div><b>Aling lara</b><span>Available pa po ba yung ba</span></div></div>
      <div class="person"><span class="pic">👤</span><div><b>Aling Jane</b><span>Hello po maganda ga</span></div></div>
      <div class="person"><span class="pic">👤</span><div><b>Aling Marie</b><span>eto po location ko sa</span></div></div>
      <div class="person"><span class="pic">👤</span><div><b>Aling Nara</b><span>Pa order nga ako isang ki</span></div></div>
      <div class="person"><span class="pic">👤</span><div><b>Mang Joseph</b><span>up po eto po location ko</span></div></div>
    </aside>
    <!-- RIGHT: the conversation -->
    <section class="chat-box">
      <h3>👤 Aling Nara</h3>
      <div class="bubble">Pa order nga ako isang kilo ng banana</div>
      <div class="chat-input"><span>📷</span><span>🖼️</span><input type="text"></div>
    </section>
  </div>
</body>
</html>
