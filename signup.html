<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect - Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <div class="auth">
    <div class="auth-left">
      <div class="brand">agriconnect</div>
      connecting farmers<br>and buyers for<br>a healthier tomorrow
    </div>
    <div class="auth-right">
      <h1 style="font-size:44px; margin-bottom:10px">create your account</h1>
      <p style="color:#999; margin-bottom:10px">join agriconnect now!</p>
      <div class="role-buttons"><a href="#">🧑‍🌾 i am a farmer</a><a href="#">💵 i am a buyer</a></div>
      <div class="input-box">👤 <input type="text" placeholder="Full name"></div>
      <div class="input-box">✉️ <input type="email" placeholder="email"></div>
      <div class="input-box">🔒 <input type="password" placeholder="Password"></div>
      <a href="login.html" class="btn">login</a>
      <p class="small-text" style="color:#888; font-size:16px; margin-top:12px">you already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>
</body>
</html>
